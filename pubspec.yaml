name: chat_baby_time
description: "말 한마디로 끝나는 육아 기록 - AI 기반 지능형 육아 로그 앱"
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  provider: ^6.1.2

  # Speech to Text
  speech_to_text: ^7.0.0

  # Date/Time
  intl: ^0.20.2

  # UUID
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^0.69.0

  # Permissions
  permission_handler: ^11.3.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  share_plus: ^12.0.1
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  home_widget: ^0.9.0
  workmanager: ^0.9.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4

  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  firebase_crashlytics: ^4.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/midjourney_session/
