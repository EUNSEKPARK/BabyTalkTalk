<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아기톡톡 - 입력 모니터링</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      background: #16213e;
      padding: 20px 32px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .header .stats {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: #8892b0;
    }
    .header .stats span { color: #64ffda; font-weight: 600; }
    .controls {
      background: #16213e;
      padding: 12px 32px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls select, .controls input {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #2a2a4a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .controls button {
      background: #64ffda;
      color: #1a1a2e;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .controls button:hover { background: #4eddc0; }
    .controls button.secondary {
      background: transparent;
      color: #64ffda;
      border: 1px solid #64ffda;
    }
    .container { padding: 20px 32px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead th {
      background: #16213e;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: #8892b0;
      position: sticky;
      top: 0;
      border-bottom: 2px solid #2a2a4a;
    }
    tbody tr {
      border-bottom: 1px solid #2a2a4a;
      transition: background 0.15s;
    }
    tbody tr:hover { background: #16213e; }
    tbody td {
      padding: 12px 16px;
      vertical-align: middle;
    }
    .raw-input {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      max-width: 400px;
      word-break: break-word;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-feeding { background: #ff9f4320; color: #ff9f43; }
    .badge-sleep { background: #6c5ce720; color: #a29bfe; }
    .badge-diaper { background: #ffeaa720; color: #fdcb6e; }
    .badge-health { background: #ff707020; color: #ff7070; }
    .badge-babyfood { background: #55efc420; color: #55efc4; }
    .badge-snack { background: #fd79a820; color: #fd79a8; }
    .badge-other { background: #636e7220; color: #b2bec3; }
    .badge-milestone { background: #74b9ff20; color: #74b9ff; }
    .confidence {
      font-weight: 600;
      font-size: 13px;
    }
    .conf-high { color: #55efc4; }
    .conf-mid { color: #ffeaa7; }
    .conf-low { color: #ff7070; }
    .source-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 8px;
      background: #2a2a4a;
      color: #8892b0;
    }
    .time {
      font-size: 12px;
      color: #8892b0;
      white-space: nowrap;
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: #8892b0;
      font-size: 16px;
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #ff7070;
    }
    .empty {
      text-align: center;
      padding: 60px;
      color: #8892b0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>아기톡톡 입력 모니터링</h1>
    <div class="stats">
      총 <span id="totalCount">-</span>건 |
      자동저장 <span id="autoRate">-</span>% |
      수정률 <span id="editRate">-</span>%
    </div>
  </div>
  <div class="controls">
    <select id="filterCategory">
      <option value="">전체 카테고리</option>
      <option value="feeding">수유</option>
      <option value="babyfood">이유식</option>
      <option value="snack">간식</option>
      <option value="sleep">수면</option>
      <option value="diaper">기저귀</option>
      <option value="health">건강</option>
      <option value="milestone">마일스톤</option>
      <option value="other">기타</option>
    </select>
    <select id="filterSource">
      <option value="">전체 입력방식</option>
      <option value="keyboard">키보드</option>
      <option value="voice">음성</option>
      <option value="quick">퀵입력</option>
      <option value="chat">채팅</option>
    </select>
    <input type="text" id="searchInput" placeholder="입력 내용 검색..." />
    <button onclick="loadLogs()">새로고침</button>
    <button class="secondary" onclick="exportCSV()">CSV 내보내기</button>
  </div>
  <div class="container">
    <div id="content" class="loading">데이터 로딩 중...</div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const app = initializeApp({
      apiKey: 'AIzaSyCMJGu0tthkD-He4wvd2y4Vl2c7fbzKb5c',
      projectId: 'chat-baby-time',
      storageBucket: 'chat-baby-time.firebasestorage.app',
      messagingSenderId: '606442478276',
      appId: '1:606442478276:android:e14ea7a16de64dfb934791',
    });
    const db = getFirestore(app);

    let allLogs = [];

    const categoryLabel = {
      feeding: '수유', babyfood: '이유식', snack: '간식',
      sleep: '수면', diaper: '기저귀', health: '건강',
      milestone: '마일스톤', other: '기타',
    };

    window.loadLogs = async function() {
      const content = document.getElementById('content');
      content.className = 'loading';
      content.textContent = '데이터 로딩 중...';
      try {
        const q = query(collection(db, 'nlp_logs'), orderBy('timestamp', 'desc'), limit(500));
        const snap = await getDocs(q);
        allLogs = [];
        snap.forEach(doc => {
          const d = doc.data();
          if (d.test) return; // _connection_test 제외
          allLogs.push(d);
        });
        updateStats();
        renderTable();
      } catch (e) {
        content.className = 'error';
        content.innerHTML = '<p>데이터 로딩 실패</p><p style="font-size:13px;margin-top:8px;color:#8892b0;">' +
          e.message + '</p>' +
          '<p style="font-size:13px;margin-top:16px;color:#ffeaa7;">Firestore 규칙에서 read를 허용해야 합니다:<br>' +
          '<code>allow read: if true;</code></p>';
      }
    };

    function updateStats() {
      document.getElementById('totalCount').textContent = allLogs.length;
      const auto = allLogs.filter(l => l.appAction === 'autoSaved').length;
      document.getElementById('autoRate').textContent = allLogs.length ? Math.round(auto / allLogs.length * 100) : 0;
      const edited = allLogs.filter(l => l.wasEdited).length;
      document.getElementById('editRate').textContent = allLogs.length ? Math.round(edited / allLogs.length * 100) : 0;
    }

    function getFiltered() {
      const cat = document.getElementById('filterCategory').value;
      const src = document.getElementById('filterSource').value;
      const search = document.getElementById('searchInput').value.toLowerCase();
      return allLogs.filter(l => {
        if (cat && l.detectedCategory !== cat) return false;
        if (src && l.inputSource !== src) return false;
        if (search && !(l.rawInput || '').toLowerCase().includes(search)) return false;
        return true;
      });
    }

    function renderTable() {
      const logs = getFiltered();
      const content = document.getElementById('content');
      if (logs.length === 0) {
        content.className = 'empty';
        content.textContent = '데이터가 없습니다.';
        return;
      }
      let html = '<table><thead><tr>' +
        '<th>시간</th><th>입력 내용</th><th>카테고리</th><th>신뢰도</th><th>입력방식</th><th>수정</th>' +
        '</tr></thead><tbody>';
      for (const l of logs) {
        const ts = l.timestamp ? new Date(l.timestamp).toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '-';
        const cat = l.detectedCategory || 'other';
        const confClass = l.confidence > 0.7 ? 'conf-high' : l.confidence >= 0.4 ? 'conf-mid' : 'conf-low';
        const edited = l.wasEdited ? '<span style="color:#ff7070;">O → ' + (l.correctedCategory || '?') + '</span>' : '<span style="color:#555;">-</span>';
        html += '<tr>' +
          '<td class="time">' + ts + '</td>' +
          '<td class="raw-input">' + escHtml(l.rawInput || '') + '</td>' +
          '<td><span class="badge badge-' + cat + '">' + (categoryLabel[cat] || cat) + '</span></td>' +
          '<td class="confidence ' + confClass + '">' + (l.confidence != null ? (l.confidence * 100).toFixed(0) + '%' : '-') + '</td>' +
          '<td><span class="source-badge">' + (l.inputSource || '-') + '</span></td>' +
          '<td>' + edited + '</td>' +
          '</tr>';
      }
      html += '</tbody></table>';
      content.className = '';
      content.innerHTML = html;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    window.exportCSV = function() {
      const logs = getFiltered();
      let csv = '\uFEFF시간,입력내용,카테고리,신뢰도,입력방식,수정여부,수정카테고리\n';
      for (const l of logs) {
        const ts = l.timestamp || '';
        const raw = (l.rawInput || '').replace(/"/g, '""');
        csv += `"${ts}","${raw}","${l.detectedCategory || ''}",${l.confidence || 0},"${l.inputSource || ''}",${l.wasEdited || false},"${l.correctedCategory || ''}"\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nlp_logs_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
    };

    // 필터 변경 시 실시간 반영
    document.getElementById('filterCategory').addEventListener('change', renderTable);
    document.getElementById('filterSource').addEventListener('change', renderTable);
    document.getElementById('searchInput').addEventListener('input', renderTable);

    // 초기 로드
    loadLogs();
  </script>
</body>
</html>
